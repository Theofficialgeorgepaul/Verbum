<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
  <link rel="stylesheet" href="quotegenerator.css">
</head>

<body>

  </div>

  <script src="quotegenerator.js"></script>
</body>

</html>
